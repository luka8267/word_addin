<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bunken Web Importer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>bunken</h1>
      <span id="status">未接続</span>
    </header>

    <section id="updateNotice" class="notice" hidden>
      <strong>最新版があります。</strong>
      <p id="updateText">bunkenアプリから再ダウンロードしてください。</p>
      <button id="openUpdateApp" type="button">bunken アプリを開く</button>
    </section>

    <form id="authPanel">
      <p class="helper">bunken と同じアカウントでログインしてください。</p>
      <div class="login-grid">
        <label>メール
          <input id="email" name="username" type="email" autocomplete="username" placeholder="you@example.com" required>
        </label>
        <label>パスワード
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Supabase password" required>
        </label>
      </div>
      <button id="login" type="submit">ログイン</button>
    </form>

    <section id="importPanel" hidden>
      <section id="preview" hidden>
        <strong id="title"></strong>
        <p id="meta"></p>
        <p id="doi"></p>
        <p id="pdf"></p>
        <label id="pdfSelectWrap" hidden>PDF候補
          <select id="pdfCandidate"></select>
        </label>
      </section>

      <div class="actions">
        <button id="extract">ページ情報を更新</button>
        <button id="save">bunken に保存</button>
      </div>
      <button id="openPdf" type="button" disabled>PDF候補を開く</button>
      <button id="openApp" type="button">bunken アプリを開く</button>
      <button id="logout" type="button">ログアウト</button>
    </section>

    <pre id="message" aria-live="polite"></pre>
    <p id="versionLine" class="version-line"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
