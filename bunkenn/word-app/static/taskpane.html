<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bunken Word</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --panel: #fbfcfe;
        --card: #ffffff;
        --text: #17202a;
        --muted: #5b6675;
        --faint: #8793a3;
        --primary: #0f766e;
        --primary-soft: #e6f4f1;
        --secondary: #fff6db;
        --secondary-text: #b7791f;
        --danger: #b42318;
        --danger-soft: #fee7e7;
        --line: #d9dee7;
        --selected: #e6f4f1;
      }
      * { box-sizing: border-box; }
      html { width: 100%; overflow-x: hidden; }
      .hidden { display: none; }
      body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        padding: 10px 10px 16px;
        font-family: "Segoe UI", "Hiragino Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }
      main { width: 100%; max-width: 100%; overflow-x: hidden; }
      .header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        margin: -10px -10px 10px;
        padding: 12px 12px 10px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(8px);
      }
      .title { margin: 0; font-size: 18px; letter-spacing: 0; }
      .subtitle { margin: 4px 0 0; font-size: 12px; color: var(--muted); line-height: 1.35; }
      .badge {
        padding: 5px 9px;
        border-radius: 999px;
        border: 1px solid #f3d37a;
        font-size: 11px;
        font-weight: 700;
        color: var(--secondary-text);
        background: var(--secondary);
        white-space: nowrap;
      }
      .badge.ready { background: var(--primary-soft); border-color: #a7dcd3; color: var(--primary); }
      .card {
        width: 100%;
        max-width: 100%;
        margin-bottom: 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        box-shadow: none;
        overflow: hidden;
      }
      h2 { margin: 0 0 9px; font-size: 15px; line-height: 1.3; }
      input, select {
        width: 100%;
        padding: 9px 10px;
        border-radius: 7px;
        border: 1px solid var(--line);
        font-size: 13px;
        background: #fff;
        color: var(--text);
        margin-bottom: 8px;
        outline: none;
      }
      input:focus, select:focus {
        border-color: #80c9bd;
        box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.12);
      }
      .message, .status { margin: 10px 0 12px; font-size: 12px; color: var(--muted); }
      .status {
        position: sticky;
        bottom: 0;
        z-index: 9;
        margin: 10px -10px -16px;
        padding: 9px 12px;
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.96);
      }
      .list { display: grid; gap: 8px; width: 100%; min-width: 0; }
      .paper-item {
        display: block;
        text-align: left;
        width: 100%;
        max-width: 100%;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #fff;
        padding: 10px;
        cursor: pointer;
        font: inherit;
        color: var(--text);
        overflow: hidden;
      }
      .paper-item:hover { border-color: #a7dcd3; background: var(--panel); }
      .paper-item.selected { border-color: #80c9bd; background: var(--selected); }
      .paper-title { display: block; margin-bottom: 5px; font-size: 13px; line-height: 1.25; color: #102033; overflow-wrap: anywhere; }
      .paper-meta { display: block; font-size: 11px; line-height: 1.35; color: var(--muted); overflow-wrap: anywhere; }
      .paper-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 20px;
        padding: 2px 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 700;
      }
      .pill.accent { border-color: #a7dcd3; background: var(--primary-soft); color: var(--primary); }
      .pill.warning { border-color: #f3d37a; background: var(--secondary); color: var(--secondary-text); }
      .pill.danger { border-color: #f5b8b8; background: var(--danger-soft); color: var(--danger); }
      .citation-item { width: 100%; text-align: left; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--text); padding: 10px; font: inherit; cursor: pointer; }
      .citation-item:hover { border-color: #a7dcd3; background: var(--panel); }
      .citation-item:focus { outline: 2px solid #0f766e; outline-offset: 2px; }
      .citation-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 8px; }
      .citation-label { font-size: 12px; font-weight: 700; color: #102033; }
      .citation-ref { font-size: 11px; color: var(--primary); font-weight: 700; }
      .citation-paper { display: block; margin-top: 6px; font-size: 11px; line-height: 1.35; color: var(--muted); }
      .citation-context { color: #52606d; overflow-wrap: anywhere; }
      .sync-issues { margin: 10px 0 0; padding: 10px 12px; border-radius: 8px; border: 1px solid #f3d37a; background: var(--secondary); color: var(--secondary-text); font-size: 12px; }
      .sync-issues.hidden { display: none; }
      .sync-issue { display: block; margin-top: 4px; }
      .edit-panel { margin-top: 12px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
      .edit-panel.hidden { display: none; }
      .edit-title { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: #102033; }
      .edit-row { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
      .edit-row:first-of-type { border-top: none; }
      .edit-actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
      .button { width: 100%; min-height: 34px; padding: 9px 11px; border-radius: 7px; border: none; font-weight: 700; cursor: pointer; }
      .button.primary { background: var(--primary); color: #fff; }
      .button.secondary { border: 1px solid #f3d37a; background: var(--secondary); color: var(--secondary-text); }
      .button.ghost { border: 1px solid var(--line); background: #fff; color: var(--text); }
      .button:disabled, input:disabled, select:disabled { opacity: 0.55; cursor: not-allowed; }
      .inline-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; min-width: 0; }
      .inline-row > * { min-width: 0; }
      .inline-row.start { align-items: center; }
      .user-line { margin: 0; font-size: 12px; color: var(--muted); }
      .toggle-button {
        width: auto;
        min-height: 30px;
        padding: 7px 10px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
        font-size: 11.5px;
        font-weight: 700;
        cursor: pointer;
      }
      .toggle-button:hover, .button.ghost:hover { border-color: #a7dcd3; background: var(--panel); }
      .collapsible.hidden { display: none; }
      @media (max-width: 330px) {
        body { padding-left: 8px; padding-right: 8px; }
        .header { margin-left: -8px; margin-right: -8px; }
        .inline-row.start { display: grid; grid-template-columns: 1fr; }
        .toggle-button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="header">
        <div>
          <h1 class="title">bunken Word</h1>
          <p class="subtitle">Word で引用と参考文献を挿入します。</p>
        </div>
        <span id="ready-badge" class="badge">Loading</span>
      </header>

      <section id="auth-card" class="card">
        <h2>ログイン</h2>
        <input id="email-input" type="email" placeholder="メールアドレス" />
        <input id="password-input" type="password" placeholder="パスワード" />
        <button id="login-button" class="button primary">bunkenn にログイン</button>
        <p id="auth-message" class="message">bunkenn のアカウントでログインすると、その人の文献だけが表示されます。</p>
      </section>

      <section id="app-card" class="card hidden">
        <div class="inline-row">
          <div>
            <h2>アカウント</h2>
            <p id="user-message" class="user-line"></p>
          </div>
          <button id="logout-button" class="button ghost" style="width:auto; padding:10px 14px;">ログアウト</button>
        </div>
      </section>

      <section id="search-card" class="card hidden">
        <div class="inline-row start">
          <div>
            <h2>文献検索</h2>
          </div>
          <button id="refresh-papers-button" class="toggle-button" type="button">更新</button>
        </div>
        <input id="search-input" placeholder="例: Suzuki 2024 / DOI / 年" />
        <div class="inline-row start">
          <input id="tag-filter-input" placeholder="タグで絞り込み" />
          <input id="collection-filter-input" placeholder="コレクションで絞り込み" />
        </div>
        <p id="search-message" class="message">タイトル、著者、雑誌名、DOI、年、タグ、コレクションで検索できます。</p>
        <div id="search-results" class="list"></div>
      </section>

      <section id="library-card" class="card hidden">
        <div class="inline-row start">
          <div>
            <h2>文献一覧</h2>
            <p id="library-message" class="message">通常は閉じたままにして、必要なときだけ開けます。</p>
          </div>
          <button id="library-toggle-button" class="toggle-button" type="button">一覧を開く</button>
        </div>
        <div id="library-panel" class="collapsible hidden">
          <div id="library-results" class="list"></div>
        </div>
      </section>

      <section id="citation-card" class="card hidden">
        <h2>引用挿入</h2>
        <p id="selection-message" class="message">文献を選ぶと本文に引用を挿入できます。</p>
        <select id="style-select">
          <option value="vancouver">Vancouver</option>
          <option value="apa">APA</option>
          <option value="acs">ACS</option>
          <option value="nature">Nature</option>
          <option value="ieee">IEEE</option>
          <option value="elsevier-harvard">Elsevier Harvard</option>
          <option value="chicago-author-date">Chicago Author-Date</option>
        </select>
        <input id="custom-style-input" placeholder="任意CSL ID: 例 american-chemical-society" />
        <input id="locator-input" placeholder="ページ番号・位置: 例 p. 25 / pp. 10-12" />
        <button id="insert-citation-button" class="button primary">本文に引用を挿入</button>
        <div class="inline-row start" style="margin-top:10px;">
          <button id="load-selected-citation-button" class="toggle-button" type="button">選択中の引用を編集</button>
          <button id="save-citation-locator-button" class="toggle-button" type="button">ページ番号を保存</button>
        </div>
        <button id="add-paper-to-citation-button" class="button secondary" type="button">この引用に文献を追加</button>
        <div id="citation-edit-panel" class="edit-panel hidden">
          <p id="citation-edit-title" class="edit-title">編集中の引用</p>
          <div id="citation-edit-items" class="list"></div>
          <button id="delete-citation-button" class="button ghost" type="button">引用を削除</button>
        </div>
      </section>

      <section id="bibliography-card" class="card hidden">
        <h2>参考文献</h2>
        <p class="message">文書内の引用をもとに、末尾の参考文献ブロックを更新します。</p>
        <button id="refresh-bibliography-button" class="button secondary">参考文献を更新</button>
      </section>

      <section id="document-citations-card" class="card hidden">
        <div class="inline-row start">
          <div>
            <h2>この文書の引用</h2>
            <p id="document-citations-message" class="message">文書内で使っている文献を表示します。</p>
          </div>
          <button id="document-citations-toggle-button" class="toggle-button" type="button">引用一覧を開く</button>
        </div>
        <div id="document-citations-panel" class="collapsible hidden">
          <div class="inline-row start" style="margin-bottom:10px;">
            <button id="check-document-citations-button" class="toggle-button" type="button">同期状態を確認</button>
            <button id="refresh-document-citations-button" class="toggle-button" type="button">引用一覧を更新</button>
          </div>
          <div id="document-sync-issues" class="sync-issues hidden"></div>
          <button id="repair-document-citations-button" class="button secondary hidden" type="button">引用同期を修復</button>
          <div id="document-citations-list" class="list"></div>
        </div>
      </section>

      <footer id="status" class="status">Word と接続中です。</footer>
    </main>
    <script src="./taskpane.js?v=citation-ranges-v3"></script>
  </body>
</html>
